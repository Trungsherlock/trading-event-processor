name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit SHA (a tag can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"   # global.json then makes sure the 10.0 SDK is the one used

      - run: dotnet --info | head -n 20

      - run: dotnet restore TradeProcessor.slnx

      - name: Build (warnings are errors in CI)
        run: dotnet build TradeProcessor.slnx --no-restore -c Release -p:TreatWarningsAsErrors=true

      - name: Unit tests (no Docker)
        run: >
          dotnet test tests/TradeProcessor.UnitTests --no-build -c Release
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults/unit
          --collect:"XPlat Code Coverage"

      # ubuntu-latest has Docker, so Testcontainers starts real Postgres and Kafka here.
      - name: Integration tests (real Postgres and Kafka via Testcontainers)
        run: >
          dotnet test tests/TradeProcessor.IntegrationTests --no-build -c Release
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults/integration
          --collect:"XPlat Code Coverage"

      - name: Test summary
        if: always()
        run: |
          count() { grep -o "<Counters [^>]*>" "$1" | grep -o " $2=\"[0-9]*\"" | grep -o "[0-9]*"; }
          {
            echo "### Test results"
            echo "| Tests | Total | Passed | Failed | Not run |"
            echo "|---|---|---|---|---|"
            for name in unit integration; do
              trx="TestResults/$name/$name.trx"
              if [ -f "$trx" ]; then
                echo "| $name | $(count "$trx" total) | $(count "$trx" passed) | $(count "$trx" failed) | $(count "$trx" notExecuted) |"
              else
                echo "| $name | did not run | | | |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 14
