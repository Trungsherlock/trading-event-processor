version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # One grouped PR a month for NuGet packages instead of one PR per package.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
